# Docker's embedded DNS; re-resolve upstreams so container restarts don't leave stale IPs.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80;
  server_name _;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Same allow-list as production (nginx/prod.conf): browsers only reach uploaded files, the view beacon,
  # newsletter confirm/unsubscribe and health. The PocketBase admin UI is on the loopback port 8090.
  location /pb/ { return 404; }
  location ~ ^/pb/api/(files/.+|views/[a-z0-9-]+|subscribers/(confirm|unsubscribe)|health)$ {
    set $pb http://pocketbase:8090;
    rewrite ^/pb/(.*)$ /$1 break;
    proxy_pass $pb;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header User-Agent $http_user_agent;
    proxy_read_timeout 30s;
  }

  location / {
    set $web http://web:4321;
    proxy_pass $web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
