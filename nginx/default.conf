# Docker's embedded DNS; re-resolve upstreams so container restarts don't leave stale IPs.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80;
  server_name _;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # The PocketBase admin dashboard is never public; reach it via the loopback-only port / an SSH tunnel.
  location ^~ /pb/_/ {
    return 404;
  }

  location /pb/ {
    set $pb http://pocketbase:8090;
    rewrite ^/pb/(.*)$ /$1 break;
    proxy_pass $pb;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }

  location / {
    set $web http://web:4321;
    proxy_pass $web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
