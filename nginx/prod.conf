# Production nginx for amir-zouerami.dev: TLS, caching, rate limits, security headers.
# Variables ${SERVER_NAME} are substituted by the nginx image's envsubst templating (see compose.prod.yaml).

resolver 127.0.0.11 valid=10s ipv6=off;

# Access log with the app's trace id (x-trace-id response header) so a request can be followed nginx → web → PocketBase.
log_format traced '$remote_addr [$time_iso8601] "$request" $status $body_bytes_sent '
                  'rt=$request_time cache=$upstream_cache_status trace=$upstream_http_x_trace_id';
access_log /dev/stdout traced;

# --- rate limits (per client IP) ---------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;      # sign-in / sign-up / reset / verify
limit_req_zone $binary_remote_addr zone=write:10m rate=30r/m;     # comments, likes, subscribe
limit_req_zone $binary_remote_addr zone=pbapi:10m rate=120r/m;    # PocketBase API through /pb
limit_req_zone $binary_remote_addr zone=page:10m rate=600r/m;
limit_req_status 429;
limit_conn_zone $binary_remote_addr zone=conn:10m;

# --- cache for anonymous HTML ------------------------------------------------------------------
# Short TTL: a publish shows up within CACHE_TTL seconds (or immediately after `deploy/purge-cache.sh`).
proxy_cache_path /var/cache/nginx/html levels=1:2 keys_zone=html:20m max_size=200m inactive=10m use_temp_path=off;

map $http_cookie $has_session { default 0; "~*(^|;\s*)(session|refresh|signed_in)=" 1; }
map $request_method $cacheable_method { GET 1; HEAD 1; default 0; }
map "$has_session$cacheable_method" $skip_cache { default 1; "01" 0; }

server {
  listen 80;
  server_name ${SERVER_NAME} www.${SERVER_NAME};
  location / { return 301 https://${SERVER_NAME}$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name www.${SERVER_NAME};
  # the wildcard certificate (*.${SERVER_NAME}) is issued and renewed by the caddy container (docs/cert-auto-renewal.md)
  ssl_certificate ${CERT_DIR}/wildcard_.${SERVER_NAME}/wildcard_.${SERVER_NAME}.crt;
  ssl_certificate_key ${CERT_DIR}/wildcard_.${SERVER_NAME}/wildcard_.${SERVER_NAME}.key;
  return 301 https://${SERVER_NAME}$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name ${SERVER_NAME};

  # the bare-domain certificate, issued and renewed by the caddy container (docs/cert-auto-renewal.md)
  ssl_certificate ${CERT_DIR}/${SERVER_NAME}/${SERVER_NAME}.crt;
  ssl_certificate_key ${CERT_DIR}/${SERVER_NAME}/${SERVER_NAME}.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;
  ssl_stapling on;
  ssl_stapling_verify on;

  server_tokens off;
  client_max_body_size 2m;
  client_body_timeout 15s;
  keepalive_timeout 30s;
  limit_conn conn 40;

  gzip on;
  gzip_comp_level 5;
  gzip_vary on;
  gzip_types text/css application/javascript application/json application/xml application/rss+xml image/svg+xml text/plain;

  # --- security headers --------------------------------------------------------------------
  include /etc/nginx/security_headers.conf;

  # --- PocketBase ----------------------------------------------------------------------------
  # Browsers only ever need four public endpoints. Everything else (record APIs, auth, admin UI) is reachable
  # only through the web app, so the bot guard, validation and rate limits cannot be bypassed.
  #   • uploaded files   GET  /pb/api/files/...
  #   • view beacon      POST /pb/api/views/<slug>
  #   • newsletter links POST /pb/api/subscribers/(confirm|unsubscribe)
  #   • health           GET  /pb/api/health
  # The admin UI: `ssh -L 8090:127.0.0.1:8090 <vps>` then http://127.0.0.1:8090/_/
  location /pb/ { return 404; } # plain prefix: the regex locations below take precedence for the allowed paths
  location ~ ^/pb/api/files/ {
    limit_req zone=pbapi burst=120 nodelay;
    set $pb http://pocketbase:8090;
    rewrite ^/pb/(.*)$ /$1 break;
    proxy_pass $pb;
    proxy_set_header Host $host;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=2592000" always;
    include /etc/nginx/security_headers.conf;
  }
  location ~ ^/pb/api/(views/[a-z0-9-]+|subscribers/(confirm|unsubscribe)|health)$ {
    limit_req zone=pbapi burst=30 nodelay;
    set $pb http://pocketbase:8090;
    rewrite ^/pb/(.*)$ /$1 break;
    proxy_pass $pb;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header User-Agent $http_user_agent;
    proxy_read_timeout 30s;
  }

  # --- web app: auth + writes get strict rate limits ---------------------------------------------
  location ~ ^/api/auth/(login|register|forgot|reset|verify|resend|oauth) {
    limit_req zone=auth burst=10 nodelay;
    include /etc/nginx/proxy_web.conf;
  }
  location ~ ^/api/(comments|interactions|subscribe|account|bookmarks) {
    limit_req zone=write burst=20 nodelay;
    include /etc/nginx/proxy_web.conf;
  }
  location /api/ {
    limit_req zone=write burst=40 nodelay;
    include /etc/nginx/proxy_web.conf;
  }

  # back office: never cached, never indexed, same strict limits as auth
  location ^~ /admin {
    limit_req zone=auth burst=30 nodelay;
    include /etc/nginx/proxy_web.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/security_headers.conf;
  }
  location ^~ /api/admin/ {
    limit_req zone=pbapi burst=60 nodelay;
    client_max_body_size 25m;
    include /etc/nginx/proxy_web.conf;
  }

  # fingerprinted assets: cache forever
  location /_astro/ {
    include /etc/nginx/proxy_web.conf;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/security_headers.conf;
  }
  location /fonts/ {
    include /etc/nginx/proxy_web.conf;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=2592000" always;
    include /etc/nginx/security_headers.conf;
  }
  # generated Open Graph cards: cached by nginx and by crawlers
  location /og/ {
    include /etc/nginx/proxy_web.conf;
    proxy_cache html;
    proxy_cache_valid 200 1d;
    proxy_cache_valid 404 1m;
    add_header X-Cache-Status $upstream_cache_status always;
    include /etc/nginx/security_headers.conf;
  }

  # one URL per page: /blog/ -> /blog (permanent), so search engines never see duplicates
  location ~ ^/(?!pb/|api/|_astro/|fonts/|og/)(.+)/$ {
    absolute_redirect off;
    return 301 /$1$is_args$args;
  }

  # pages: anonymous requests are cached briefly; anything with a session cookie bypasses the cache
  location / {
    limit_req zone=page burst=100 nodelay;
    include /etc/nginx/proxy_web.conf;
    proxy_cache html;
    proxy_cache_key "$scheme$host$request_uri";
    proxy_cache_bypass $skip_cache;
    proxy_no_cache $skip_cache;
    proxy_cache_valid 200 ${CACHE_TTL}s;
    proxy_cache_valid 404 30s;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
    proxy_ignore_headers Set-Cookie;
    # never cache previews or error responses that carry no-store
    add_header X-Cache-Status $upstream_cache_status always;
    include /etc/nginx/security_headers.conf;
  }
}
