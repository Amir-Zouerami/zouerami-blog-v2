# Production nginx for zouerami.dev: TLS, caching, rate limits, security headers.
# Variables ${SERVER_NAME} are substituted by the nginx image's envsubst templating (see compose.prod.yaml).

resolver 127.0.0.11 valid=10s ipv6=off;

# --- rate limits (per client IP) ---------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;      # sign-in / sign-up / reset / verify
limit_req_zone $binary_remote_addr zone=write:10m rate=30r/m;     # comments, likes, subscribe
limit_req_zone $binary_remote_addr zone=pbapi:10m rate=120r/m;    # PocketBase API through /pb
limit_req_zone $binary_remote_addr zone=page:10m rate=600r/m;
limit_req_status 429;
limit_conn_zone $binary_remote_addr zone=conn:10m;

# --- cache for anonymous HTML ------------------------------------------------------------------
# Short TTL: a publish shows up within CACHE_TTL seconds (or immediately after `deploy/purge-cache.sh`).
proxy_cache_path /var/cache/nginx/html levels=1:2 keys_zone=html:20m max_size=200m inactive=10m use_temp_path=off;

map $http_cookie $has_session { default 0; "~*(^|;\s*)(session|refresh|signed_in)=" 1; }
map $request_method $cacheable_method { GET 1; HEAD 1; default 0; }
map "$has_session$cacheable_method" $skip_cache { default 1; "01" 0; }

server {
  listen 80;
  server_name ${SERVER_NAME} www.${SERVER_NAME};
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://${SERVER_NAME}$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name www.${SERVER_NAME};
  ssl_certificate /etc/letsencrypt/live/${SERVER_NAME}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/${SERVER_NAME}/privkey.pem;
  return 301 https://${SERVER_NAME}$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name ${SERVER_NAME};

  ssl_certificate /etc/letsencrypt/live/${SERVER_NAME}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/${SERVER_NAME}/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;
  ssl_stapling on;
  ssl_stapling_verify on;

  server_tokens off;
  client_max_body_size 2m;
  client_body_timeout 15s;
  keepalive_timeout 30s;
  limit_conn conn 40;

  gzip on;
  gzip_comp_level 5;
  gzip_vary on;
  gzip_types text/css application/javascript application/json application/xml application/rss+xml image/svg+xml text/plain;

  # --- security headers --------------------------------------------------------------------
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

  # --- PocketBase ----------------------------------------------------------------------------
  # The admin UI is never public: reach it with `ssh -L 8090:127.0.0.1:8090 <vps>` (loopback port in compose.prod.yaml).
  location ^~ /pb/_/ { return 404; }
  location ^~ /pb/api/admins { return 404; }
  location ^~ /pb/api/collections/_superusers { return 404; }
  # record auth is done by the web app server-side; browsers never need these through the proxy
  location ~ ^/pb/api/collections/users/(auth-with-password|auth-with-oauth2|request-password-reset|confirm-password-reset|request-verification|confirm-verification|request-otp|auth-with-otp)$ { return 404; }
  location /pb/ {
    limit_req zone=pbapi burst=60 nodelay;
    set $pb http://pocketbase:8090;
    rewrite ^/pb/(.*)$ /$1 break;
    proxy_pass $pb;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
    # uploaded post images: long cache (filenames are unique per upload)
    location ~ ^/pb/api/files/ {
      limit_req zone=pbapi burst=120 nodelay;
      set $pbf http://pocketbase:8090;
      rewrite ^/pb/(.*)$ /$1 break;
      proxy_pass $pbf;
      proxy_set_header Host $host;
      proxy_hide_header Cache-Control;
      add_header Cache-Control "public, max-age=2592000" always;
      add_header X-Content-Type-Options "nosniff" always;
    }
  }

  # --- web app: auth + writes get strict rate limits ---------------------------------------------
  location ~ ^/api/auth/(login|register|forgot|reset|verify|resend|oauth) {
    limit_req zone=auth burst=10 nodelay;
    include /etc/nginx/proxy_web.conf;
  }
  location ~ ^/api/(comments|interactions|subscribe|account|bookmarks) {
    limit_req zone=write burst=20 nodelay;
    include /etc/nginx/proxy_web.conf;
  }
  location /api/ {
    limit_req zone=write burst=40 nodelay;
    include /etc/nginx/proxy_web.conf;
  }

  # fingerprinted assets: cache forever
  location /_astro/ {
    include /etc/nginx/proxy_web.conf;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
  location /fonts/ {
    include /etc/nginx/proxy_web.conf;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=2592000" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
  # generated Open Graph cards: cached by nginx and by crawlers
  location /og/ {
    include /etc/nginx/proxy_web.conf;
    proxy_cache html;
    proxy_cache_valid 200 1d;
    proxy_cache_valid 404 1m;
    add_header X-Cache-Status $upstream_cache_status always;
  }

  # pages: anonymous requests are cached briefly; anything with a session cookie bypasses the cache
  location / {
    limit_req zone=page burst=100 nodelay;
    include /etc/nginx/proxy_web.conf;
    proxy_cache html;
    proxy_cache_key "$scheme$host$request_uri";
    proxy_cache_bypass $skip_cache;
    proxy_no_cache $skip_cache;
    proxy_cache_valid 200 ${CACHE_TTL}s;
    proxy_cache_valid 404 30s;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
    proxy_ignore_headers Set-Cookie;
    # never cache previews or error responses that carry no-store
    add_header X-Cache-Status $upstream_cache_status always;
  }
}
