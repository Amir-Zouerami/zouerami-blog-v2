# Production stack for the VPS. Standalone (does not layer on compose.yaml).
#   cp .env.example .env   # fill in: SITE_URL, AUTH_SECRET, PB_SUPERUSER_*, SMTP_*, S3_*, OAuth ids
#   docker compose -f compose.prod.yaml up -d
name: zouerami
services:
  pocketbase:
    image: ${POCKETBASE_IMAGE:-zouerami-pocketbase:local}
    build: ./pocketbase
    restart: unless-stopped
    env_file: .env
    environment:
      SITE_URL: ${SITE_URL}
    volumes:
      - pb_data:/pb_data
    ports:
      - '127.0.0.1:8090:8090' # admin UI via SSH tunnel only
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8090/api/health']
      interval: 10s
      timeout: 3s
      retries: 12
    deploy: { resources: { limits: { memory: 512m } } }

  web:
    image: ${WEB_IMAGE:-zouerami-web:local}
    build: ./web
    restart: unless-stopped
    environment:
      PB_URL: http://pocketbase:8090
      PB_PUBLIC_URL: /pb
      SITE_URL: ${SITE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_PRETTY: 'false' # JSON lines for log shipping
    depends_on:
      pocketbase: { condition: service_healthy }
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    deploy: { resources: { limits: { memory: 768m } } }

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      SERVER_NAME: ${SERVER_NAME:-amir-zouerami.dev}
      CACHE_TTL: ${CACHE_TTL:-60}
      # where the caddy container stores the certificates (the directory name follows the ACME server in use)
      CERT_DIR: /caddy-data/caddy/certificates/${ACME_CA_DIR:-acme-v02.api.letsencrypt.org-directory}
      NGINX_ENVSUBST_FILTER: '^(SERVER_NAME|CACHE_TTL|CERT_DIR)$$'
    volumes:
      - ./nginx/prod.conf:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/proxy_web.conf:/etc/nginx/proxy_web.conf:ro
      - ./nginx/security_headers.conf:/etc/nginx/security_headers.conf:ro
      - caddy_data:/caddy-data:ro
      - nginx_cache:/var/cache/nginx
    security_opt: ['no-new-privileges:true']
    depends_on:
      web: { condition: service_started }
      pocketbase: { condition: service_started }
      caddy: { condition: service_healthy }
    # pick up renewed certificates: reload every 12 hours
    command: ['/bin/sh', '-c', 'while :; do sleep 12h & wait $${!}; nginx -s reload; done & exec /docker-entrypoint.sh nginx -g "daemon off;"']

  # Gets and renews the Let's Encrypt certificates (wildcard + bare domain) through the Parspack DNS API.
  caddy:
    image: ${CADDY_IMAGE:-zouerami-caddy:local}
    build: ./caddy
    restart: unless-stopped
    environment:
      SERVER_NAME: ${SERVER_NAME:-amir-zouerami.dev}
      PARSPACK_API_TOKEN: ${PARSPACK_API_TOKEN}
      ACME_CA: ${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    healthcheck:
      # healthy once both certificates exist
      test: ['CMD-SHELL', 'ls /data/caddy/certificates/*/$$SERVER_NAME/$$SERVER_NAME.crt /data/caddy/certificates/*/wildcard_.$$SERVER_NAME/wildcard_.$$SERVER_NAME.crt >/dev/null 2>&1']
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 30s
    deploy: { resources: { limits: { memory: 256m } } }

volumes:
  pb_data:
  caddy_data:
  caddy_config:
  nginx_cache:
