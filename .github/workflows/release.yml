name: release
# main: test -> build images -> deploy to the VPS. Tags v*: test -> build images only.
on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  images:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: web
            context: web
          - name: pocketbase
            context: pocketbase
          - name: caddy
            context: caddy
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/zouerami-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: images
    runs-on: ubuntu-latest
    environment: production # add required reviewers in the repo settings if you want a manual approval gate
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST || 'SERVER_IP' }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/srv/zouerami' }}
    steps:
      - uses: actions/checkout@v4
      - name: SSH setup
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Ship compose, nginx and deploy files
        run: |
          tar czf - compose.prod.yaml nginx deploy caddy \
            | ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH' && tar xzf - -C '$DEPLOY_PATH'"
      - name: Put the images into the server's own registry over SSH (the server downloads nothing from GitHub)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          TAG="sha-${{ github.sha }}"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && docker compose -f compose.prod.yaml up -d registry"
          # the registry listens on the server's 127.0.0.1:5000 only; this tunnel makes it our 127.0.0.1:5000
          ssh -f -N -o ExitOnForwardFailure=yes -o ServerAliveInterval=15 -L 127.0.0.1:5000:127.0.0.1:5000 "$DEPLOY_USER@$DEPLOY_HOST"
          for _ in $(seq 1 20); do curl -fs http://127.0.0.1:5000/v2/ >/dev/null && break; sleep 1; done
          curl -fs http://127.0.0.1:5000/v2/ >/dev/null
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for name in web pocketbase caddy; do
            src="ghcr.io/$OWNER/zouerami-$name:$TAG"
            dst="127.0.0.1:5000/zouerami-$name:$TAG"
            docker pull "$src"
            docker tag "$src" "$dst"
            ok=0
            for _ in 1 2 3; do
              if docker push "$dst"; then ok=1; break; fi
              sleep 5
            done
            [ "$ok" = 1 ]
          done
      - name: Deploy
        run: |
          TAG="sha-${{ github.sha }}"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && WEB_IMAGE=127.0.0.1:5000/zouerami-web:$TAG POCKETBASE_IMAGE=127.0.0.1:5000/zouerami-pocketbase:$TAG CADDY_IMAGE=127.0.0.1:5000/zouerami-caddy:$TAG sh deploy/deploy.sh"
      - name: Smoke test
        run: curl -fsSI --retry 6 --retry-delay 10 --retry-all-errors https://amir-zouerami.dev/ -o /dev/null
