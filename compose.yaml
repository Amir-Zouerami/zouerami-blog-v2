name: zouerami
services:
  pocketbase:
    build:
      context: ./pocketbase
      # Optional: set BUILD_NETWORK=host and BUILD_PROXY=http://127.0.0.1:PORT in .env when the
      # build container has no direct internet (e.g. a host-side proxy). Empty/default otherwise.
      network: ${BUILD_NETWORK:-default}
      args:
        http_proxy: ${BUILD_PROXY:-}
        https_proxy: ${BUILD_PROXY:-}
        HTTP_PROXY: ${BUILD_PROXY:-}
        HTTPS_PROXY: ${BUILD_PROXY:-}
    restart: unless-stopped
    env_file: .env
    volumes:
      - pb_data:/pb_data
      - ./pocketbase/pb_migrations:/pb/pb_migrations:ro
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8090/api/health']
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    build:
      context: ./web
      network: ${BUILD_NETWORK:-default}
      args:
        http_proxy: ${BUILD_PROXY:-}
        https_proxy: ${BUILD_PROXY:-}
        HTTP_PROXY: ${BUILD_PROXY:-}
        HTTPS_PROXY: ${BUILD_PROXY:-}
    restart: unless-stopped
    # Only what the web app needs: never hand it the PocketBase superuser credentials.
    environment:
      PB_URL: ${PB_URL}
      PB_PUBLIC_URL: ${PB_PUBLIC_URL}
      SITE_URL: ${SITE_URL}
    depends_on:
      pocketbase:
        condition: service_healthy

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-8088}:80'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - pocketbase

volumes:
  pb_data:
